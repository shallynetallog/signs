    body {
      font-family: Arial, sans-serif;
      text-align: center;

    .diamond-sign {
      margin: 20px auto;
      width: 150px;
      height: 150px;
      background: orange;
      color: black;
      transform: rotate(45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      border: 2px solid #333;
    }
    .diamond-sign span {
      transform: rotate(-45deg);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      width: 80%;
      margin: 0 auto;
    }
    .sign-box {
      background: #333;
      padding: 5px;
    }
    .sign {
      width: 80px;
      height: 80px;
      background: orange;
      margin: 0 auto;
      transform: rotate(45deg);
      border: 2px solid black;
    }
    .label {
      margin-top: 5px;
      color: white;
      font-size: 14px;
    }
    .coords {
      margin: 10px 0;
      font-family: monospace;
    }
  </style>
